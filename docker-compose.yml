# Onda v3.4.4 — Contenedor unificado (Python + Go + Nginx + Svelte)
# GPU auto-detect en runtime. Perfiles/overrides para CUDA, ROCm, CPU.
#
# Uso:
#   docker compose up -d --build                      # CPU mode (default)
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d --build   # CUDA
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build   # ROCm
#
# O simplemente: bash deploy.sh   (detección automática)
#
# Variables de entorno (via .env):
#   ONDA_PORT    — puerto de la UI (default: 3000)
#   MODEL_DIR    — ruta local a los modelos (default: ./models)

services:
  onda:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
        ONDAP_VERSION: "${ONDAP_VERSION:-unknown}"
        GUI_VERSION: "${GUI_VERSION:-unknown}"
    image: onda:${ONDAP_VERSION:-latest}
    container_name: onda
    ports:
      - "${ONDA_PORT:-3000}:3000"
    environment:
      - ONDAP_VERSION=${ONDAP_VERSION:-unknown}
      - GUI_VERSION=${GUI_VERSION:-unknown}
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - XDG_CACHE_HOME=/tmp/xdg_cache
      - HF_HOME=/tmp/hf_cache
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:rw
      - ./input:/input
      - ./output:/output
      - ./input_rubberband:/input_rubberband
      - ./daw-data:/daw-data
      - ./config:/config
      - ./logs:/app/logs
      # Bind-mount del script del pipeline: refleja los cambios del host en el
      # contenedor sin rebuild ni `docker cp`, evitando drift silencioso.
      - ./pipeline.sh:/app/pipeline.sh:ro
      # mounts /app/ para el pipeline de feat (paths unificados bajo /app/)
      - ./input:/app/input
      - ./output:/app/output
      - ./input_rubberband:/app/input_rubberband
      - ./config:/app/config
      - pytorch-cache:/opt/pytorch-backends
    restart: unless-stopped

volumes:
  pytorch-cache:
