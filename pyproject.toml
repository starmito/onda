[project]
name = "onda"
version = "3.5.0"
description = "Audio source separation pipeline: BS-Roformer → HTDemucs → Rubberband"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.0+cpu",
    "torchvision==0.29.0+cpu",
    "demucs==4.1.0",
    "sphn==0.2.1",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "numpy==2.4.6",
    "PyYAML==6.0.3",
]

[project.scripts]
onda = "onda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
