[project]
name = "onda"
version = "3.5.0"
description = "Audio source separation pipeline: BS-Roformer → HTDemucs → Rubberband"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "demucs==4.1.0",
    "sphn>=0.1.12",
    "librosa",
    "soundfile",
    "numpy",
    "pyyaml",
]

[project.scripts]
onda = "onda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
